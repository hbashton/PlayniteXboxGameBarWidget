name: Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build package
        run: >
          msbuild PlayniteXboxGameBarWidget.sln
          /restore
          /p:Configuration=Release
          /p:Platform=x64
          /p:AppxBundle=Always
          /p:AppxBundlePlatforms=x64
          /p:UapAppxPackageBuildMode=SideLoadOnly
          /p:AppxPackageSigningEnabled=false

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlayniteXboxGameBarWidget
          path: |
            PlayniteXboxGameBarWidget/AppPackages/**
            PlayniteXboxGameBarWidget/bin/x64/Release/**
          if-no-files-found: warn
