name: Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install UWP build tools
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $installPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          & $installer modify `
            --installPath $installPath `
            --add Microsoft.VisualStudio.Workload.Universal `
            --add Microsoft.VisualStudio.Component.Windows10SDK.19041 `
            --add Microsoft.VisualStudio.Component.Windows11SDK.26100 `
            --includeRecommended `
            --quiet `
            --norestart

      - name: Locate Windows metadata
        shell: pwsh
        run: |
          $winmd = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\UnionMetadata" -Filter Windows.winmd -Recurse |
            Where-Object { $_.FullName -notmatch '\\Facade\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $winmd) {
            Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\UnionMetadata" -Filter Windows.winmd -Recurse |
              Select-Object FullName
            throw "A versioned Windows.winmd was not found under the Windows Kits UnionMetadata folder. Facade metadata is not enough for this UWP build."
          }
          $sdkVersion = $winmd.Directory.Name
          "WindowsWinmdPath=$($winmd.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TargetPlatformVersion=$sdkVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          $winmd.FullName
          $sdkVersion

      - name: Restore and build package
        shell: pwsh
        run: >
          msbuild PlayniteXboxGameBarWidget.sln
          /restore
          /p:Configuration=Release
          /p:Platform=x64
          /p:AppxBundle=Always
          /p:AppxBundlePlatforms=x64
          /p:UapAppxPackageBuildMode=SideLoadOnly
          /p:AppxPackageSigningEnabled=false
          /p:WindowsWinmdPath="$env:WindowsWinmdPath"
          /p:TargetPlatformVersion="$env:TargetPlatformVersion"

      - name: Prepare loose install artifact
        shell: pwsh
        run: |
          $output = "artifacts\PlayniteXboxWidgetLoose"
          New-Item -ItemType Directory -Force $output | Out-Null
          Copy-Item "PlayniteXboxGameBarWidget\bin\x64\Release\ilc\*" $output -Recurse -Force

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlayniteXboxGameBarWidget
          path: |
            PlayniteXboxGameBarWidget/AppPackages/**
            artifacts/PlayniteXboxWidgetLoose/**
          if-no-files-found: warn
