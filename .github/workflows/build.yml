name: Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install UWP build tools
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $installPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          & $installer modify `
            --installPath $installPath `
            --add Microsoft.VisualStudio.Workload.Universal `
            --add Microsoft.VisualStudio.Component.Windows10SDK.19041 `
            --includeRecommended `
            --quiet `
            --norestart

      - name: Restore and build package
        run: >
          msbuild PlayniteXboxGameBarWidget.sln
          /restore
          /p:Configuration=Release
          /p:Platform=x64
          /p:AppxBundle=Always
          /p:AppxBundlePlatforms=x64
          /p:UapAppxPackageBuildMode=SideLoadOnly
          /p:AppxPackageSigningEnabled=false

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PlayniteXboxGameBarWidget
          path: |
            PlayniteXboxGameBarWidget/AppPackages/**
            PlayniteXboxGameBarWidget/bin/x64/Release/**
          if-no-files-found: warn
